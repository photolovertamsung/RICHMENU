<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>วิธีสั่งงาน — Polaroid Tamsung</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f8f8f8;
  --surface:#ffffff;
  --border:#e8e8e8;
  --text:#1a1a1a;
  --muted:#999;
  --accent:#1a1a1a;
  --radius:18px;
}
body{
  font-family:'Noto Sans Thai',sans-serif;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0;
  overflow-x:hidden;
}

/* Header */
.header{
  width:100%;
  max-width:480px;
  padding:28px 20px 16px;
  text-align:center;
}
.header-name{
  font-size:17px;
  font-weight:600;
  letter-spacing:0.04em;
  color:var(--text);
}
.header-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
  letter-spacing:0.02em;
}

/* CTA */
.cta-wrap{
  width:100%;
  max-width:480px;
  padding:0 20px 20px;
}
.cta-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:13px 20px;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  color:var(--text);
  text-decoration:none;
  letter-spacing:0.01em;
  transition:background 0.15s, border-color 0.15s;
  cursor:pointer;
}
.cta-btn:active{background:#f0f0f0;}
.cta-emoji{font-size:17px;}
.cta-arrow{
  margin-left:auto;
  font-size:13px;
  color:var(--muted);
  font-weight:400;
}

/* Slider */
.slider-wrap{
  width:100%;
  max-width:480px;
  padding:0 20px;
  position:relative;
}
.slider{
  position:relative;
  width:100%;
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  touch-action:pan-y;
  user-select:none;
}
.slide{
  display:none;
  flex-direction:column;
  animation:fadeIn 0.22s ease;
}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeInLeft{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
.slide.left{animation:fadeInLeft 0.22s ease;}

.slide-inner img{
  width:100%;
  display:block;
  object-fit:cover;
  max-height:62vw;
  object-position:top;
}
.slide-info{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  border-top:1px solid var(--border);
}
.slide-emoji{
  font-size:22px;
  flex-shrink:0;
  width:36px;
  text-align:center;
}
.slide-title{
  font-size:14px;
  font-weight:600;
  color:var(--text);
  line-height:1.4;
}

/* Nav arrows */
.nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(calc(-50% - 22px));
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(255,255,255,0.92);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:16px;
  color:var(--text);
  z-index:10;
  transition:background 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.nav-btn:active{background:#ebebeb;}
.nav-prev{left:8px;}
.nav-next{right:8px;}

/* Counter */
.counter{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:10px;
  letter-spacing:0.05em;
  font-weight:500;
}

/* Dots */
.dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:10px;
  padding-bottom:4px;
}
.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--border);
  cursor:pointer;
  transition:background 0.2s, transform 0.2s;
}
.dot.active{
  background:var(--accent);
  transform:scale(1.3);
}

/* Dashboard */

/* Sticky bar */

.sticky{
  width:100%;
  max-width:480px;
  background:#fff;
  border-top:none;
  padding:12px 20px 28px;
  display:flex;
  gap:10px;
}
.sticky-btn{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:12px 10px;
  border-radius:14px;
  font-family:inherit;
  font-size:13.5px;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
  border:none;
  transition:opacity 0.15s,transform 0.15s;
  letter-spacing:0.01em;
}
.sticky-btn:active{opacity:0.8;transform:scale(0.97);}
.btn-main{background:#1a1a1a;color:#fff;}




.sticky-remind{
  width:100%;
  max-width:480px;
  text-align:center;
  font-size:12px;
  font-weight:600;
  color:#e53e3e;
  padding:8px 20px 0;
  background:#fff;
  border-top:1px solid #e8e8e8;
}

</style>
</head>

<script>
const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');
const cur = document.getElementById('cur');
let idx = 0;
let dir = 'right';

function go(n, d) {
  slides[idx].classList.remove('active', 'left');
  dots[idx].classList.remove('active');
  dir = d;
  idx = (n + slides.length) % slides.length;
  slides[idx].classList.add('active');
  if (d === 'left') slides[idx].classList.add('left');
  dots[idx].classList.add('active');
  cur.textContent = idx + 1;
}

document.getElementById('prev').onclick = () => go(idx - 1, 'left');
document.getElementById('next').onclick = () => go(idx + 1, 'right');
dots.forEach((d, i) => d.onclick = () => go(i, i > idx ? 'right' : 'left'));

const sl = document.getElementById('slider');
let sx = 0;
sl.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
sl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 40) dx < 0 ? go(idx+1,'right') : go(idx-1,'left');
}, {passive:true});
</script>
